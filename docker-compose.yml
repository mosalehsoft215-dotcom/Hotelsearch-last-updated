# Run the whole demo:
#
#   docker compose up --build
#   open http://localhost:8000        chat console, press "Memory"
#   docker compose run --rm app python demo_memory.py    the four-scene demo
#
# .env is read as-is and never modified. The settings below only add what the
# container needs on top of it, so the graph runs without touching your file.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"          # graph browser
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # the graph lives in the falkordb service, and memory is durable
      MEMORY_BACKEND: graphiti
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # extraction on OpenRouter, vectors from the local embedder — one key total
      GRAPHITI_EMBEDDER: local
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-anthropic/claude-haiku-4.5}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-4.5}

volumes:
  falkordb-data:
